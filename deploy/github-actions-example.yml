# Example only, and untested. Copy to .github/workflows/weekend-saver.yml to activate it.
#
# Before using it:
#   1. Pin every `uses:` below to a full commit SHA. This job can mint an Azure token
#      (id-token: write), so a compromised action tag could act as the scheduler identity.
#   2. Create an Entra app registration whose federated credential subject is pinned to
#      this repo's default branch (repo:<org>/<repo>:ref:refs/heads/main), and assign it the
#      "Weekend Saver Operator" role on the TEST resource groups only, never the subscription.
#   3. Add secrets AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, the variable
#      WEEKEND_SAVER_RESOURCES (contents of your resources.yaml) and, optionally, the secret
#      WEEKEND_SAVER_WEBHOOK_URL.
#
# Runners are ephemeral, so the prior-state snapshot travels from Friday's run to Monday's
# through the Actions cache. If Friday's snapshot never arrives, Monday restores nothing or
# an older snapshot; weekend-saver detects both (missing, or last disable run too long ago)
# and exits 2 instead of reporting success. Re-run manually with ignore_prior_state then.
name: weekend-saver

on:
  schedule:
    - cron: "0 19 * * 5" # Friday 19:00 UTC -> disable
    - cron: "0 6 * * 1" # Monday 06:00 UTC -> enable
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [disable, enable]
        required: true
      ignore_prior_state:
        description: "enable only: start every listed resource that is stopped"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: weekend-saver
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore prior-state snapshot
        uses: actions/cache/restore@v4
        with:
          path: .weekend-saver/state.json
          key: weekend-saver-state-${{ github.run_id }}
          restore-keys: weekend-saver-state-

      - name: Run weekend-saver
        env:
          MANUAL_ACTION: ${{ inputs.action }}
          SCHEDULE: ${{ github.event.schedule }}
          IGNORE_PRIOR_STATE: ${{ inputs.ignore_prior_state }}
          WEEKEND_SAVER_RESOURCES: ${{ vars.WEEKEND_SAVER_RESOURCES }}
          WEEKEND_SAVER_WEBHOOK_URL: ${{ secrets.WEEKEND_SAVER_WEBHOOK_URL }}
        run: |
          # Keep these two strings identical to the cron entries above
          case "${MANUAL_ACTION:-$SCHEDULE}" in
            disable | "0 19 * * 5") action=disable ;;
            enable | "0 6 * * 1") action=enable ;;
            *) echo "Cannot tell which action to run for '${MANUAL_ACTION:-$SCHEDULE}'" >&2; exit 2 ;;
          esac
          flags=(--resources resources.yaml --yes)
          if [ "$action" = enable ] && [ "$IGNORE_PRIOR_STATE" = true ]; then
            flags+=(--ignore-prior-state)
          fi
          printf '%s\n' "$WEEKEND_SAVER_RESOURCES" > resources.yaml
          uv run --locked weekend-saver "$action" "${flags[@]}"

      - name: Save prior-state snapshot
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .weekend-saver/state.json
          key: weekend-saver-state-${{ github.run_id }}
