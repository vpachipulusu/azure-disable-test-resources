[project]
name = "weekend-saver"
version = "0.1.0"
description = "Agent Framework workflow that disables/enables Azure resources over the weekend to save cost"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core>=1.13,<2",
    "azure-identity>=1.17",
    "azure-mgmt-compute>=33.0",
    "azure-mgmt-containerservice>=31.0",
    "azure-mgmt-web>=7.3",
    "azure-mgmt-network>=27.0",
    "azure-mgmt-postgresqlflexibleservers>=1.0",
    # Beta-only package: keep it inside the series the handlers were written against
    "azure-mgmt-mysqlflexibleservers>=1.1.0b3,<2",
    "pyyaml>=6.0",
]

[project.scripts]
weekend-saver = "weekend_saver.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weekend_saver"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: hits real Azure resources; opt in with -m live"]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["weekend_saver"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
